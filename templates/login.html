<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remndrs — Login</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
  <form id="login-form" class="login-card">
    <h1>Remndrs</h1>
    <input type="text" id="login" name="login" placeholder="Name or email" autofocus required>
    <input type="password" id="password" name="password" placeholder="Password" required>
    <button type="submit">Log in</button>
    <p id="login-error" class="login-error" hidden>Invalid credentials</p>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('login').value,
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) { window.location = '/'; }
      else { document.getElementById('login-error').hidden = false; }
    });
  </script>
</body>
</html>
